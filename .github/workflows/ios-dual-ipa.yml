name: Build iOS Dual Unsigned IPAs

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "mobile/**"
      - "ios/**"
      - "internal/netbind/**"
      - "internal/gftrtc/**"
      - "internal/gft/**"
      - "internal/client/**"
      - "internal/tunstack/**"
      - "tools/gen-ios-icon/**"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/ios-dual-ipa.yml"

jobs:
  build-ios-dual:
    runs-on: macos-15
    env:
      KSL_NO_SYSPROXY: "1"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Verify Darwin Go Core & Mobile Bridge
        run: |
          GOOS=darwin GOARCH=arm64 CGO_ENABLED=0 go vet ./internal/... ./mobile/...
          CGO_ENABLED=0 go test -count=1 ./internal/netbind ./internal/tunstack ./mobile

      - name: Build Shared GhostMobile.xcframework (gomobile)
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          export PATH="$(go env GOPATH)/bin:$PATH"
          gomobile init
          go get golang.org/x/mobile/bind
          mkdir -p ios/Frameworks dist
          RAW_VER="$(tr -d ' \t\r\n' < VERSION)"
          IOS_APP_VER="${RAW_VER#v}"
          IOS_APP_VER="${IOS_APP_VER%-LTS}"
          REL_VER="v${IOS_APP_VER}"
          gomobile bind \
            -target=ios/arm64 \
            -iosversion=15.0 \
            -trimpath \
            -ldflags="-s -w -X ghostframe/internal/client.Version=${REL_VER} -X ghostframe/mobile.Version=${REL_VER}" \
            -o ios/Frameworks/GhostMobile.xcframework \
            ./mobile
          git checkout -- go.mod go.sum
          test -d ios/Frameworks/GhostMobile.xcframework/ios-arm64/GhostMobile.framework

      - name: Build & Package Edition A (Kestrel-Duo-Unsigned.ipa)
        run: |
          (cd ios && xcodegen generate --spec project-vpn.yml)
          git diff --exit-code ios/vpn
          xcodebuild \
            -project ios/KestrelDuo.xcodeproj \
            -scheme KestrelDuo \
            -configuration Release \
            -sdk iphoneos \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            BUILD_DIR="$PWD/ios/build-vpn" \
            build

          VPN_APP="$(find ios/build-vpn -maxdepth 4 -type d -name 'KestrelDuo.app' | head -n 1)"
          test -n "$VPN_APP" && test -d "$VPN_APP"
          APPEX="$VPN_APP/PlugIns/KestrelTunnel.appex"
          test -d "$APPEX"
          CTRL_APPEX="$VPN_APP/PlugIns/KestrelControlWidget.appex"
          test -d "$CTRL_APPEX"

          echo "=== Verifying KestrelTunnel Info.plist ==="
          plutil -p "$APPEX/Info.plist"
          plutil -p "$APPEX/Info.plist" | grep -q "com.apple.networkextension.packet-tunnel"
          plutil -p "$APPEX/Info.plist" | grep -q "PacketTunnelProvider"

          echo "=== Verifying KestrelControlWidget Info.plist ==="
          plutil -p "$CTRL_APPEX/Info.plist"
          plutil -p "$CTRL_APPEX/Info.plist" | grep -q "com.apple.widgetkit-extension"

          RAW_VER="$(tr -d ' \t\r\n' < VERSION)"
          IOS_APP_VER="${RAW_VER#v}"
          IOS_APP_VER="${IOS_APP_VER%-LTS}"
          if [[ "${IOS_APP_VER}" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            BUILD_NUM="$((BASH_REMATCH[1] * 100 + BASH_REMATCH[2] * 10 + BASH_REMATCH[3]))"
          else
            BUILD_NUM=$((410 + GITHUB_RUN_NUMBER))
          fi
          for plist in "$VPN_APP/Info.plist" "$APPEX/Info.plist" "$CTRL_APPEX/Info.plist"; do
            /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString ${IOS_APP_VER}" "$plist"
            /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${BUILD_NUM}" "$plist"
          done

          # Inside-out ad-hoc entitlement stamping (strictly no --deep on KestrelDuo.app)
          codesign --force --sign - --entitlements ios/vpn/Tunnel.entitlements --timestamp=none "$APPEX"
          codesign --force --sign - --entitlements ios/vpn/Control.entitlements --timestamp=none "$CTRL_APPEX"
          codesign --force --sign - --entitlements ios/vpn/App.entitlements --timestamp=none "$VPN_APP"

          codesign --verify --strict "$APPEX"
          codesign --verify --strict "$CTRL_APPEX"
          codesign --verify --strict "$VPN_APP"

          echo "=== Verifying KestrelTunnel.appex entitlements ==="
          APPEX_ENT="$(codesign -d --entitlements - --xml "$APPEX" 2>&1)"
          echo "$APPEX_ENT"
          echo "$APPEX_ENT" | grep -q "packet-tunnel-provider"
          ! echo "$APPEX_ENT" | grep -q "application-groups"

          echo "=== Verifying KestrelControlWidget.appex isolation & entitlements ==="
          CTRL_ENT="$(codesign -d --entitlements - --xml "$CTRL_APPEX" 2>&1 || true)"
          echo "$CTRL_ENT"
          ! echo "$CTRL_ENT" | grep -q "packet-tunnel-provider"
          ! echo "$CTRL_ENT" | grep -q "application-groups"
          ! otool -L "$CTRL_APPEX/KestrelControlWidget" | grep -q "GhostMobile"

          echo "=== Verifying KestrelDuo.app entitlements & AppIcon Assets.car ==="
          APP_ENT="$(codesign -d --entitlements - --xml "$VPN_APP" 2>&1)"
          echo "$APP_ENT"
          echo "$APP_ENT" | grep -q "packet-tunnel-provider"
          ! echo "$APP_ENT" | grep -q "application-groups"
          test -f "$VPN_APP/Assets.car"

          STAGE_VPN="$(mktemp -d)"
          mkdir -p "$STAGE_VPN/Payload"
          cp -R "$VPN_APP" "$STAGE_VPN/Payload/KestrelDuo.app"
          (cd "$STAGE_VPN" && zip -qry "$GITHUB_WORKSPACE/dist/Kestrel-Duo-Unsigned.ipa" Payload)
          rm -rf "$STAGE_VPN"
          ls -lh dist/Kestrel-Duo-Unsigned.ipa

      - name: Build & Package Edition B (Kestrel-Air-Unsigned.ipa)
        run: |
          (cd ios && xcodegen generate --spec project-companion.yml)
          git diff --exit-code ios/companion
          xcodebuild \
            -project ios/KestrelAir.xcodeproj \
            -scheme KestrelAir \
            -configuration Release \
            -sdk iphoneos \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            BUILD_DIR="$PWD/ios/build-companion" \
            build

          COMP_APP="$(find ios/build-companion -maxdepth 4 -type d -name 'KestrelAir.app' | head -n 1)"
          test -n "$COMP_APP" && test -d "$COMP_APP"
          test ! -d "$COMP_APP/PlugIns"

          plutil -p "$COMP_APP/Info.plist" | grep -q "audio"
          plutil -p "$COMP_APP/Info.plist" | grep -q "shadowrocket"

          RAW_VER="$(tr -d ' \t\r\n' < VERSION)"
          IOS_APP_VER="${RAW_VER#v}"
          IOS_APP_VER="${IOS_APP_VER%-LTS}"
          if [[ "${IOS_APP_VER}" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            BUILD_NUM="$((BASH_REMATCH[1] * 100 + BASH_REMATCH[2] * 10 + BASH_REMATCH[3]))"
          else
            BUILD_NUM=$((410 + GITHUB_RUN_NUMBER))
          fi
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString ${IOS_APP_VER}" "$COMP_APP/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${BUILD_NUM}" "$COMP_APP/Info.plist"

          # Single-process pure ad-hoc signature with ZERO restricted entitlements
          codesign --force --deep --sign - --timestamp=none "$COMP_APP"
          test -f "$COMP_APP/Assets.car"

          COMP_ENT="$(codesign -d --entitlements - --xml "$COMP_APP" 2>&1 || true)"
          echo "=== KestrelAir entitlements check ==="
          echo "$COMP_ENT"
          ! echo "$COMP_ENT" | grep -q "networkextension"
          ! echo "$COMP_ENT" | grep -q "application-groups"

          STAGE_COMP="$(mktemp -d)"
          mkdir -p "$STAGE_COMP/Payload"
          cp -R "$COMP_APP" "$STAGE_COMP/Payload/KestrelAir.app"
          (cd "$STAGE_COMP" && zip -qry "$GITHUB_WORKSPACE/dist/Kestrel-Air-Unsigned.ipa" Payload)
          rm -rf "$STAGE_COMP"
          ls -lh dist/Kestrel-Air-Unsigned.ipa

      - name: Upload Kestrel-Duo-Unsigned.ipa
        uses: actions/upload-artifact@v4
        with:
          name: Kestrel-Duo-Unsigned-IPA
          path: dist/Kestrel-Duo-Unsigned.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Upload Kestrel-Air-Unsigned.ipa
        uses: actions/upload-artifact@v4
        with:
          name: Kestrel-Air-Unsigned-IPA
          path: dist/Kestrel-Air-Unsigned.ipa
          if-no-files-found: error
          retention-days: 30
