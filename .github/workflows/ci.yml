name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      GFT_NO_SYSPROXY: "1"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Vet and Test (with Race Detector)
        shell: bash
        run: |
          go vet ./...
          CGO_ENABLED=1 go test -race -count=1 -v ./...

      - name: Go Fuzz Smoke Checks (3s per target)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          go test -run='^$' -fuzz=FuzzSTUNBindingReqAndPreScreen -fuzztime=3s ./internal/gftrtc
          go test -run='^$' -fuzz=FuzzRTPAndFrameDecode -fuzztime=3s ./internal/gftrtc
          go test -run='^$' -fuzz=FuzzExtractTLSClientHelloSNI -fuzztime=3s ./internal/gft
          go test -run='^$' -fuzz=FuzzEncodeDecodeAddrAndLink -fuzztime=3s ./internal/gft
          go test -run='^$' -fuzz=FuzzParseDNSResponse -fuzztime=3s ./internal/client

      - name: Zero-CGO Cross-Platform Build Check (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p /tmp/gft-ci-build
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -ldflags "-s -w" -o /tmp/gft-ci-build/gft-server ./cmd/gft-server
          GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build -trimpath -ldflags "-s -w" -o /tmp/gft-ci-build/gft-core ./cmd/gft-core
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -ldflags "-s -w -H=windowsgui" -o /tmp/gft-ci-build/GhostFrame-Pro.exe ./cmd/gft-client-gui
          rm -rf /tmp/gft-ci-build

      - name: Verify install.sh Syntax (Linux)
        if: runner.os == 'Linux'
        run: bash -n install.sh
