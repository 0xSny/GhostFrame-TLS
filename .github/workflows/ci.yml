name: CI (Core & Server)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "cmd/gft-server/**"
      - "cmd/gft-core/**"
      - "internal/gft/**"
      - "internal/gftrtc/**"
      - "internal/netbind/**"
      - "internal/client/**"
      - "internal/server/**"
      - "internal/sni/**"
      - "internal/tui/**"
      - "internal/qr/**"
      - "install.sh"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "cmd/gft-server/**"
      - "cmd/gft-core/**"
      - "internal/gft/**"
      - "internal/gftrtc/**"
      - "internal/netbind/**"
      - "internal/client/**"
      - "internal/server/**"
      - "internal/sni/**"
      - "internal/tui/**"
      - "internal/qr/**"
      - "install.sh"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/ci.yml"

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      KSL_NO_SYSPROXY: "1"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Verify Core & Server Never Link gVisor
        shell: bash
        run: |
          if go list -deps ./cmd/gft-server ./cmd/gft-core | grep -q "gvisor.dev/gvisor"; then
            echo "ERROR: Server/Core binary unexpectedly links gvisor.dev/gvisor!"
            exit 1
          fi

      - name: Vet and Test Core & Server Packages (with Race Detector)
        shell: bash
        run: |
          go vet ./cmd/gft-server ./cmd/gft-core ./internal/gft ./internal/gftrtc ./internal/netbind ./internal/client ./internal/server ./internal/sni ./internal/tui ./internal/qr
          CGO_ENABLED=1 go test -race -count=1 -v ./cmd/gft-server ./cmd/gft-core ./internal/gft ./internal/gftrtc ./internal/netbind ./internal/client ./internal/server ./internal/sni ./internal/tui ./internal/qr

      - name: Go Fuzz Smoke Checks (3s per target)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          go test -run='^$' -fuzz=FuzzSTUNBindingReqAndPreScreen -fuzztime=3s ./internal/gftrtc
          go test -run='^$' -fuzz=FuzzRTPAndFrameDecode -fuzztime=3s ./internal/gftrtc
          go test -run='^$' -fuzz=FuzzExtractTLSClientHelloSNI -fuzztime=3s ./internal/gft
          go test -run='^$' -fuzz=FuzzEncodeDecodeAddrAndLink -fuzztime=3s ./internal/gft
          go test -run='^$' -fuzz=FuzzParseDNSResponse -fuzztime=3s ./internal/client

      - name: Zero-CGO Cross-Platform Build Check (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p /tmp/ksl-ci-build
          REL_VER="v4.0.26-LTS"
          VER_X="-X ghostframe/internal/tui.CurrentVersion=${REL_VER} -X ghostframe/internal/client.Version=${REL_VER} -X ghostframe/internal/server.Version=${REL_VER} -X main.version=${REL_VER}"
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -ldflags "-s -w ${VER_X}" -o /tmp/ksl-ci-build/kestrel-server-amd64 ./cmd/gft-server
          GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build -trimpath -ldflags "-s -w ${VER_X}" -o /tmp/ksl-ci-build/kestrel-server-arm64 ./cmd/gft-server
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -ldflags "-s -w ${VER_X}" -o /tmp/ksl-ci-build/kestrel-core-amd64 ./cmd/gft-core
          GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build -trimpath -ldflags "-s -w ${VER_X}" -o /tmp/ksl-ci-build/kestrel-core-arm64 ./cmd/gft-core
          rm -rf /tmp/ksl-ci-build

      - name: Verify install.sh Syntax (Linux)
        if: runner.os == 'Linux'
        run: bash -n install.sh
