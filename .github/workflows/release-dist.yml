name: Unified Release & Dist Publish

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (must match VERSION, e.g. v4.2.6)"
        required: false
        default: ""

permissions:
  contents: write

env:
  KSL_NO_SYSPROXY: "1"
  GOMOBILE_VERSION: "v0.0.0-20261117202452-47699113848a"

jobs:
  verify-tests:
    uses: ./.github/workflows/ci.yml

  prepare-release:
    runs-on: ubuntu-latest
    outputs:
      rel_ver: ${{ steps.ver.outputs.rel_ver }}
      app_ver: ${{ steps.ver.outputs.app_ver }}
      build_num: ${{ steps.ver.outputs.build_num }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Derive and Verify Immutable Version Metadata
        id: ver
        env:
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          set -euo pipefail
          RAW_VER="$(tr -d ' \t\r\n' < VERSION)"
          if [ -z "$RAW_VER" ]; then
            echo "ERROR: VERSION file is empty" >&2
            exit 1
          fi
          APP_VER="${RAW_VER#v}"
          APP_VER="${APP_VER%-LTS}"
          if ! [[ "$APP_VER" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "ERROR: VERSION '$RAW_VER' must follow vX.Y.Z" >&2
            exit 1
          fi
          REL_VER="v${APP_VER}"
          BUILD_NUM="$((BASH_REMATCH[1] * 100 + BASH_REMATCH[2] * 10 + BASH_REMATCH[3]))"

          if [ "$REF_TYPE" = "tag" ] && [ "$REF_NAME" != "$REL_VER" ]; then
            echo "ERROR: Git tag '$REF_NAME' does not match VERSION '$REL_VER'" >&2
            exit 1
          fi
          if [ -n "$INPUT_TAG" ] && [ "$INPUT_TAG" != "$REL_VER" ]; then
            echo "ERROR: workflow_dispatch tag '$INPUT_TAG' does not match VERSION '$REL_VER'" >&2
            exit 1
          fi
          if ! grep -q "versionName = \"${APP_VER}\"" android/app/build.gradle.kts; then
            echo "ERROR: android/app/build.gradle.kts versionName does not match ${APP_VER}" >&2
            exit 1
          fi
          if ! head -n 1 README.md | grep -q "${REL_VER}"; then
            echo "ERROR: README.md heading does not match ${REL_VER}" >&2
            exit 1
          fi
          echo "rel_ver=${REL_VER}" >> "$GITHUB_OUTPUT"
          echo "app_ver=${APP_VER}" >> "$GITHUB_OUTPUT"
          echo "build_num=${BUILD_NUM}" >> "$GITHUB_OUTPUT"
          echo "Verified release version: ${REL_VER} (app=${APP_VER}, build=${BUILD_NUM}, sha=${GITHUB_SHA})"

  build-binaries:
    needs: [prepare-release]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Build Server, Core, Windows GUI & KestrelBox Side-Router
        env:
          REL_VER: ${{ needs.prepare-release.outputs.rel_ver }}
        run: |
          set -euo pipefail
          mkdir -p dist _stage_kbox/usr/bin

          export CGO_ENABLED=0
          VER_X="-X ghostframe/internal/tui.CurrentVersion=${REL_VER} -X ghostframe/internal/client.Version=${REL_VER} -X ghostframe/internal/server.Version=${REL_VER} -X main.gatewayVersion=${REL_VER} -X main.version=${REL_VER}"
          FLAGS=(-trimpath -ldflags="-s -w ${VER_X}")

          GOOS=linux   GOARCH=amd64 go build "${FLAGS[@]}" -o dist/kestrel-server-linux-amd64 ./cmd/gft-server
          GOOS=linux   GOARCH=arm64 go build "${FLAGS[@]}" -o dist/kestrel-server-linux-arm64 ./cmd/gft-server
          GOOS=linux   GOARCH=amd64 go build "${FLAGS[@]}" -o dist/kestrel-core-linux-amd64   ./cmd/gft-core
          GOOS=linux   GOARCH=arm64 go build "${FLAGS[@]}" -o dist/kestrel-core-linux-arm64   ./cmd/gft-core
          go run scripts/gen_win_rsrc.go
          GOOS=windows GOARCH=amd64 go build -trimpath -ldflags="-s -w -H=windowsgui ${VER_X}" -o dist/Kestrel-Pro-windows-amd64.exe ./cmd/gft-client-gui
          go run scripts/pack_setup_payload.go -in dist/Kestrel-Pro-windows-amd64.exe -out cmd/kestrel-setup/Kestrel-Pro.payload.zlib
          GOOS=windows GOARCH=amd64 go build -tags setup_embed -trimpath -ldflags="-s -w -H=windowsgui ${VER_X}" -o dist/Kestrel-Pro-Setup-windows-amd64.exe ./cmd/kestrel-setup
          GOOS=linux   GOARCH=amd64 go build "${FLAGS[@]}" -o dist/kbox-linux-amd64            ./cmd/0ghost
          GOOS=linux   GOARCH=arm64 go build "${FLAGS[@]}" -o dist/kbox-linux-arm64            ./cmd/0ghost

          cp dist/kbox-linux-arm64 _stage_kbox/usr/bin/kbox
          cp -r openwrt/luci-app-0ghost/etc _stage_kbox/
          cp -r openwrt/luci-app-0ghost/usr/* _stage_kbox/usr/
          cp -r openwrt/luci-app-0ghost/www _stage_kbox/
          cp openwrt/luci-app-0ghost/install-local.sh _stage_kbox/install-local.sh
          chmod 0755 _stage_kbox/usr/bin/kbox _stage_kbox/etc/init.d/kbox \
                     _stage_kbox/etc/hotplug.d/iface/99-kbox _stage_kbox/etc/hotplug.d/firewall/99-kbox \
                     _stage_kbox/install-local.sh
          tar -czf dist/kbox-istoreos-arm64.tar.gz -C _stage_kbox .
          rm -rf _stage_kbox

          cp install.sh dist/install.sh
          cp scripts/install-kbox.sh dist/install-kbox.sh
          cp scripts/install-0ghost.sh dist/install-0ghost.sh
          cp internal/client/rules_bundle.zlib dist/rules_bundle.zlib
          chmod 0755 dist/install.sh dist/install-kbox.sh dist/install-0ghost.sh
          ls -lh dist/

      - name: Upload Linux/Windows/Router Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-linux-windows-router
          path: dist/*
          if-no-files-found: error

  build-ios:
    needs: [prepare-release]
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Build GhostMobile.xcframework & Dual Unsigned IPAs
        env:
          REL_VER: ${{ needs.prepare-release.outputs.rel_ver }}
          IOS_APP_VER: ${{ needs.prepare-release.outputs.app_ver }}
          DIST_BUILD_NUM: ${{ needs.prepare-release.outputs.build_num }}
        run: |
          set -euo pipefail
          go install "golang.org/x/mobile/cmd/gomobile@${GOMOBILE_VERSION}"
          go install "golang.org/x/mobile/cmd/gobind@${GOMOBILE_VERSION}"
          export PATH="$(go env GOPATH)/bin:$PATH"
          gomobile init
          go get "golang.org/x/mobile/bind@${GOMOBILE_VERSION}"
          mkdir -p ios/Frameworks dist

          gomobile bind \
            -target=ios/arm64 \
            -iosversion=15.0 \
            -trimpath \
            -ldflags="-s -w -X ghostframe/internal/client.Version=${REL_VER} -X ghostframe/mobile.Version=${REL_VER}" \
            -o ios/Frameworks/GhostMobile.xcframework \
            ./mobile
          git checkout -- go.mod go.sum

          (cd ios && xcodegen generate --spec project-vpn.yml)
          xcodebuild \
            -project ios/KestrelDuo.xcodeproj \
            -scheme KestrelDuo \
            -configuration Release \
            -sdk iphoneos \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            BUILD_DIR="$PWD/ios/build-vpn" \
            build

          VPN_APP="$(find ios/build-vpn -maxdepth 4 -type d -name 'KestrelDuo.app' | head -n 1)"
          APPEX="$VPN_APP/PlugIns/KestrelTunnel.appex"
          CTRL_APPEX="$VPN_APP/PlugIns/KestrelControlWidget.appex"
          for plist in "$VPN_APP/Info.plist" "$APPEX/Info.plist" "$CTRL_APPEX/Info.plist"; do
            /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString ${IOS_APP_VER}" "$plist"
            /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${DIST_BUILD_NUM}" "$plist"
          done
          codesign --force --sign - --entitlements ios/vpn/Tunnel.entitlements --timestamp=none "$APPEX"
          codesign --force --sign - --entitlements ios/vpn/Control.entitlements --timestamp=none "$CTRL_APPEX"
          codesign --force --sign - --entitlements ios/vpn/App.entitlements --timestamp=none "$VPN_APP"
          STAGE_VPN="$(mktemp -d)"
          mkdir -p "$STAGE_VPN/Payload"
          cp -R "$VPN_APP" "$STAGE_VPN/Payload/KestrelDuo.app"
          (cd "$STAGE_VPN" && zip -qry "$GITHUB_WORKSPACE/dist/Kestrel-Duo-Unsigned.ipa" Payload)
          rm -rf "$STAGE_VPN"

          (cd ios && xcodegen generate --spec project-companion.yml)
          xcodebuild \
            -project ios/KestrelAir.xcodeproj \
            -scheme KestrelAir \
            -configuration Release \
            -sdk iphoneos \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            BUILD_DIR="$PWD/ios/build-companion" \
            build

          COMP_APP="$(find ios/build-companion -maxdepth 4 -type d -name 'KestrelAir.app' | head -n 1)"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString ${IOS_APP_VER}" "$COMP_APP/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${DIST_BUILD_NUM}" "$COMP_APP/Info.plist"
          codesign --force --deep --sign - --timestamp=none "$COMP_APP"
          STAGE_COMP="$(mktemp -d)"
          mkdir -p "$STAGE_COMP/Payload"
          cp -R "$COMP_APP" "$STAGE_COMP/Payload/KestrelAir.app"
          (cd "$STAGE_COMP" && zip -qry "$GITHUB_WORKSPACE/dist/Kestrel-Air-Unsigned.ipa" Payload)
          rm -rf "$STAGE_COMP"

          ls -lh dist/*.ipa

      - name: Upload iOS Dual IPAs
        uses: actions/upload-artifact@v4
        with:
          name: release-ios-ipas
          path: dist/*.ipa
          if-no-files-found: error

  build-android:
    needs: [prepare-release]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Ensure Android SDK & NDK
        run: |
          set -euo pipefail
          SDK_DIR="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          export ANDROID_HOME="$SDK_DIR"
          export ANDROID_SDK_ROOT="$SDK_DIR"
          SDKMAN="$(command -v sdkmanager || find "$SDK_DIR/cmdline-tools" -name sdkmanager 2>/dev/null | head -n 1 || true)"
          if [ -n "$SDKMAN" ]; then
            yes | "$SDKMAN" --sdk_root="$SDK_DIR" --licenses >/dev/null || true
            if [ ! -d "$SDK_DIR/platforms/android-35" ] || [ ! -d "$SDK_DIR/build-tools/35.0.0" ]; then
              "$SDKMAN" --sdk_root="$SDK_DIR" "platforms;android-35" "build-tools;35.0.0"
            fi
            NDK_DIR="$(ls -1d "$SDK_DIR"/ndk/* 2>/dev/null | sort -V | tail -n 1 || true)"
            if [ -z "$NDK_DIR" ]; then
              "$SDKMAN" --sdk_root="$SDK_DIR" "ndk;27.2.12479018"
              NDK_DIR="$(ls -1d "$SDK_DIR"/ndk/* 2>/dev/null | sort -V | tail -n 1)"
            fi
          else
            NDK_DIR="$(ls -1d "$SDK_DIR"/ndk/* 2>/dev/null | sort -V | tail -n 1)"
          fi
          echo "ANDROID_HOME=$SDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$NDK_DIR" >> "$GITHUB_ENV"

      - name: Build GhostMobile.aar & Kestrel-Android.apk
        env:
          REL_VER: ${{ needs.prepare-release.outputs.rel_ver }}
        run: |
          set -euo pipefail
          go install "golang.org/x/mobile/cmd/gomobile@${GOMOBILE_VERSION}"
          go install "golang.org/x/mobile/cmd/gobind@${GOMOBILE_VERSION}"
          export PATH="$(go env GOPATH)/bin:$PATH"
          gomobile init
          go get "golang.org/x/mobile/bind@${GOMOBILE_VERSION}"
          mkdir -p android/app/libs dist
          gomobile bind \
            -target=android/arm64,android/arm,android/amd64 \
            -androidapi=24 \
            -trimpath \
            -ldflags="-s -w -X ghostframe/internal/client.Version=${REL_VER} -X ghostframe/mobile.Version=${REL_VER}" \
            -o android/app/libs/GhostMobile.aar \
            ./mobile
          git checkout -- go.mod go.sum

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Package Official Signed Android Release APK
        env:
          KESTREL_ANDROID_KEYSTORE_B64: ${{ secrets.KESTREL_ANDROID_KEYSTORE_B64 }}
          KESTREL_KEYSTORE_PASS: ${{ secrets.KESTREL_KEYSTORE_PASS }}
          KESTREL_KEY_ALIAS: ${{ secrets.KESTREL_KEY_ALIAS }}
          KESTREL_KEY_PASS: ${{ secrets.KESTREL_KEY_PASS }}
        run: |
          set -euo pipefail
          if [ -z "${KESTREL_ANDROID_KEYSTORE_B64:-}" ] || [ -z "${KESTREL_KEYSTORE_PASS:-}" ] || [ -z "${KESTREL_KEY_ALIAS:-}" ] || [ -z "${KESTREL_KEY_PASS:-}" ]; then
            echo "ERROR: Official Android release signing secrets (KESTREL_ANDROID_KEYSTORE_B64, KESTREL_KEYSTORE_PASS, KESTREL_KEY_ALIAS, KESTREL_KEY_PASS) are required." >&2
            exit 1
          fi
          echo "$KESTREL_ANDROID_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/kestrel-release.jks"
          chmod 600 "$RUNNER_TEMP/kestrel-release.jks"
          export KESTREL_KEYSTORE_PATH="$RUNNER_TEMP/kestrel-release.jks"

          gradle -p android assembleRelease --no-daemon
          APK_PATH="$(find android/app/build/outputs/apk/release -name '*.apk' | head -n 1)"
          test -f "$APK_PATH"
          cp "$APK_PATH" dist/Kestrel-Android.apk

          APKSIGNER="$(find "${ANDROID_HOME}/build-tools" -name apksigner 2>/dev/null | sort -V | tail -n 1 || true)"
          if [ -n "$APKSIGNER" ]; then
            "$APKSIGNER" verify --print-certs dist/Kestrel-Android.apk > dist/android-signing-cert.txt
            cat dist/android-signing-cert.txt
          fi
          ls -lh dist/Kestrel-Android.apk

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: release-android-apk
          path: dist/Kestrel-Android.apk
          if-no-files-found: error

      - name: Upload Android Signing Cert Info
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-android-cert
          path: dist/android-signing-cert.txt
          if-no-files-found: ignore

  publish-release:
    needs: [verify-tests, prepare-release, build-binaries, build-ios, build-android]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download All Built Artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist-stage

      - name: Assemble Unified Release Bundle, Signed Manifests & Checksums
        id: prep
        env:
          DIST_PUSH_TOKEN: ${{ secrets.DIST_PUSH_TOKEN }}
          RELEASE_SIGNING_KEY_PEM: ${{ secrets.RELEASE_SIGNING_KEY_PEM }}
          TAG: ${{ needs.prepare-release.outputs.rel_ver }}
          APP_VER: ${{ needs.prepare-release.outputs.app_ver }}
          SOURCE_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p release-out
          cp dist-stage/release-linux-windows-router/* release-out/
          cp dist-stage/release-ios-ipas/*.ipa release-out/
          cp dist-stage/release-android-apk/Kestrel-Android.apk release-out/
          if [ -f dist-stage/release-android-cert/android-signing-cert.txt ]; then
            cp dist-stage/release-android-cert/android-signing-cert.txt release-out/
          fi
          cp ios/Shared/Assets.xcassets/AppIcon.appiconset/AppIcon-1024.png release-out/icon-kestrel.png

          for req in \
            kestrel-server-linux-amd64 \
            kestrel-server-linux-arm64 \
            kestrel-core-linux-amd64 \
            kestrel-core-linux-arm64 \
            Kestrel-Pro-windows-amd64.exe \
            Kestrel-Pro-Setup-windows-amd64.exe \
            kbox-linux-amd64 \
            kbox-linux-arm64 \
            kbox-istoreos-arm64.tar.gz \
            Kestrel-Duo-Unsigned.ipa \
            Kestrel-Air-Unsigned.ipa \
            Kestrel-Android.apk \
            install.sh \
            install-kbox.sh \
            install-0ghost.sh \
            rules_bundle.zlib; do
            if [ ! -s "release-out/${req}" ]; then
              echo "ERROR: Missing or empty required release asset: ${req}" >&2
              exit 1
            fi
          done

          echo "RELEASE_TAG=$TAG" >> "$GITHUB_ENV"

          TARGET_REPO="$SOURCE_REPO"
          HAS_DIST="false"
          if [ -n "${DIST_PUSH_TOKEN}" ]; then
            TARGET_REPO="Spittingjiu/Ghost"
            HAS_DIST="true"
          fi
          echo "TARGET_REPO=$TARGET_REPO" >> "$GITHUB_ENV"
          echo "has_dist_token=${HAS_DIST}" >> "$GITHUB_OUTPUT"

          DUO_SIZE="$(stat -c%s release-out/Kestrel-Duo-Unsigned.ipa)"
          AIR_SIZE="$(stat -c%s release-out/Kestrel-Air-Unsigned.ipa)"
          KBOX_SIZE="$(stat -c%s release-out/kbox-istoreos-arm64.tar.gz)"
          KBOX_SHA="$(sha256sum release-out/kbox-istoreos-arm64.tar.gz | awk '{print $1}')"
          NOW_ISO="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          BASE_DL="https://github.com/${TARGET_REPO}/releases/download/${TAG}"

          cat > release-out/kbox-manifest.txt <<EOF
          version=${TAG}
          arch=arm64
          file=kbox-istoreos-arm64.tar.gz
          size=${KBOX_SIZE}
          sha256=${KBOX_SHA}
          commit=${GITHUB_SHA}
          EOF

          python3 - <<PY
          import glob, hashlib, json, os
          manifest = {
              "name": "Kestrel Official Release Source",
              "identifier": "com.kestrel.official.source",
              "sourceURL": f"https://github.com/${TARGET_REPO}/releases/latest/download/source.json",
              "iconURL": f"${BASE_DL}/icon-kestrel.png",
              "apps": [
                  {
                      "name": "Kestrel Duo",
                      "bundleIdentifier": "com.kestrel.duo",
                      "developerName": "Kestrel Project",
                      "subtitle": "Kestrel-RTC v4.0 LTS (System Tunnel + Control Center)",
                      "localizedDescription": "Kestrel Duo iOS system tunnel edition built from ${TAG}.",
                      "iconURL": f"${BASE_DL}/icon-kestrel.png",
                      "tintColor": "0F62FE",
                      "version": "${APP_VER}",
                      "versionDate": "${NOW_ISO}",
                      "versionDescription": "Release ${TAG}",
                      "downloadURL": f"${BASE_DL}/Kestrel-Duo-Unsigned.ipa",
                      "size": int("${DUO_SIZE}"),
                      "versions": [{
                          "version": "${APP_VER}",
                          "date": "${NOW_ISO}",
                          "localizedDescription": "Release ${TAG}",
                          "downloadURL": f"${BASE_DL}/Kestrel-Duo-Unsigned.ipa",
                          "size": int("${DUO_SIZE}"),
                      }],
                  },
                  {
                      "name": "Kestrel Air",
                      "bundleIdentifier": "com.kestrel.air",
                      "developerName": "Kestrel Project",
                      "subtitle": "Portable Single-Process Proxy Edition",
                      "localizedDescription": "Kestrel Air portable proxy edition built from ${TAG}.",
                      "iconURL": f"${BASE_DL}/icon-kestrel.png",
                      "tintColor": "10B981",
                      "version": "${APP_VER}",
                      "versionDate": "${NOW_ISO}",
                      "versionDescription": "Release ${TAG}",
                      "downloadURL": f"${BASE_DL}/Kestrel-Air-Unsigned.ipa",
                      "size": int("${AIR_SIZE}"),
                      "versions": [{
                          "version": "${APP_VER}",
                          "date": "${NOW_ISO}",
                          "localizedDescription": "Release ${TAG}",
                          "downloadURL": f"${BASE_DL}/Kestrel-Air-Unsigned.ipa",
                          "size": int("${AIR_SIZE}"),
                      }],
                  },
              ],
          }
          with open("release-out/source.json", "w", encoding="utf-8") as f:
              json.dump(manifest, f, indent=2, ensure_ascii=False)

          assets = []
          for p in sorted(glob.glob("release-out/*")):
              name = os.path.basename(p)
              if name in ("checksums.txt", "checksums.txt.sig", "release-manifest.json"):
                  continue
              with open(p, "rb") as fp:
                  data = fp.read()
              assets.append({
                  "file": name,
                  "size": len(data),
                  "sha256": hashlib.sha256(data).hexdigest(),
              })
          rel_manifest = {
              "version": "${TAG}",
              "commit": "${GITHUB_SHA}",
              "built_at": "${NOW_ISO}",
              "gomobile_version": "${GOMOBILE_VERSION}",
              "assets": assets,
          }
          with open("release-out/release-manifest.json", "w", encoding="utf-8") as f:
              json.dump(rel_manifest, f, indent=2, ensure_ascii=False)
          PY

          (cd release-out && sha256sum * > /tmp/checksums.txt && mv /tmp/checksums.txt checksums.txt && cat checksums.txt)

          if [ -n "${RELEASE_SIGNING_KEY_PEM:-}" ]; then
            printf '%s\n' "$RELEASE_SIGNING_KEY_PEM" > "$RUNNER_TEMP/release-signing.pem"
            chmod 600 "$RUNNER_TEMP/release-signing.pem"
            openssl pkeyutl -sign -inkey "$RUNNER_TEMP/release-signing.pem" -rawin \
              -in release-out/kbox-manifest.txt -out release-out/kbox-manifest.txt.sig
            openssl pkeyutl -sign -inkey "$RUNNER_TEMP/release-signing.pem" -rawin \
              -in release-out/checksums.txt -out release-out/checksums.txt.sig
            rm -f "$RUNNER_TEMP/release-signing.pem"
          elif [ "$HAS_DIST" = "true" ]; then
            echo "ERROR: RELEASE_SIGNING_KEY_PEM secret is required when publishing to Spittingjiu/Ghost." >&2
            exit 1
          fi

      - name: Upload Unified Release Bundle Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kestrel-Unified-Release
          path: release-out/*
          if-no-files-found: error

      - name: Publish Immutable Pure-Binary Release to Spittingjiu/Ghost
        if: steps.prep.outputs.has_dist_token == 'true'
        env:
          GH_TOKEN: ${{ secrets.DIST_PUSH_TOKEN }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo Spittingjiu/Ghost >/dev/null 2>&1; then
            echo "ERROR: Release $RELEASE_TAG already exists on Spittingjiu/Ghost. Refusing to overwrite immutable release assets." >&2
            exit 1
          fi
          gh release create "$RELEASE_TAG" release-out/* \
            --repo Spittingjiu/Ghost \
            --title "Kestrel ${RELEASE_TAG} (All Platforms)" \
            --notes "Automated verified multi-platform release (${RELEASE_TAG}, commit ${GITHUB_SHA})."

      - name: Fallback Release on Current Repository (when DIST_PUSH_TOKEN not set)
        if: steps.prep.outputs.has_dist_token != 'true' && (github.ref_type == 'tag' || inputs.tag != '')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          generate_release_notes: true
          files: release-out/*
