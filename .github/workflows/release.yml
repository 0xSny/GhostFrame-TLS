name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 02_Source_Code/go.mod
          cache-dependency-path: 02_Source_Code/go.sum

      - name: Cross-compile Zero-CGO Multi-Platform Artifacts
        run: |
          set -euo pipefail
          mkdir -p dist
          cd 02_Source_Code

          export CGO_ENABLED=0
          FLAGS=(-trimpath -ldflags="-s -w")

          GOOS=linux   GOARCH=amd64 go build "${FLAGS[@]}" -o ../dist/gft-server-linux-amd64 ./cmd/gft-server
          GOOS=linux   GOARCH=arm64 go build "${FLAGS[@]}" -o ../dist/gft-server-linux-arm64 ./cmd/gft-server
          GOOS=linux   GOARCH=arm64 go build "${FLAGS[@]}" -o ../dist/gft-core-linux-arm64   ./cmd/gft-core
          GOOS=linux   GOARCH=amd64 go build "${FLAGS[@]}" -o ../dist/gft-core-linux-amd64   ./cmd/gft-core
          GOOS=windows GOARCH=amd64 go build -trimpath -ldflags="-s -w -H=windowsgui" -o ../dist/GhostFrame-Pro-windows-amd64.exe ./cmd/gft-client-gui

          cd ../dist
          cp ../install.sh ./install.sh
          sha256sum gft-server-linux-amd64 \
                    gft-server-linux-arm64 \
                    gft-core-linux-arm64 \
                    gft-core-linux-amd64 \
                    GhostFrame-Pro-windows-amd64.exe \
                    install.sh > checksums.txt
          cat checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/gft-server-linux-amd64
            dist/gft-server-linux-arm64
            dist/gft-core-linux-arm64
            dist/gft-core-linux-amd64
            dist/GhostFrame-Pro-windows-amd64.exe
            dist/install.sh
            dist/checksums.txt
